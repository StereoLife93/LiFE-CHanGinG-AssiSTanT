<!DOCTYPE html>
<html>
<head>
  <title>Life Changing Assistant</title>
</head>
<body style="font-family: Arial; padding: 20px;">

<h2>Life Changing Assistant</h2>

<div id="chat"></div>

<input id="input" style="width: 70%;" />
<button onclick="send()">Senden</button>

<script>

const API = "https://life-changing-assistant.onrender.com/chat";

async function send() {

  const inputElement = document.getElementById("input");
  const chat = document.getElementById("chat");

  const input = inputElement.value;

  if (!input) return;

  chat.innerHTML += `
    <p><b>Du:</b> ${input}</p>
    <p>⏳ KI denkt nach...</p>
  `;

  try {

    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: input
      })
    });

    const data = await res.json();

    chat.innerHTML += `
      <p><b>AI:</b> ${data.response}</p>
      <hr>
    `;

  } catch (err) {

    chat.innerHTML += `
      <p style="color:red;">
        Fehler: Backend antwortet nicht
      </p>
    `;

    console.error(err);
  }

  inputElement.value = "";
}

</script>

</body>
</html>
